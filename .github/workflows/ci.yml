name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
  PYTHONUTF8: '1'

jobs:
  academic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.23'
      - run: mkdir -p .tmp .cache
      - run: uv sync --locked --python 3.11
      - name: Frozen core and tests
        run: |
          # Restore Git-normalized line endings only if they match the exact
          # frozen Windows bytes; any source/content change still fails.
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('verifikasi/core_manifest.json').read_text())
          for name, expected in manifest.items():
              path = Path(name)
              content = path.read_bytes()
              if hashlib.sha256(content).hexdigest() != expected:
                  content = content.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                  assert hashlib.sha256(content).hexdigest() == expected, name
                  path.write_bytes(content)
          print('Frozen core: all original SHA256 values match')
          PY
          uv run pytest -q
          uv run python -m extensions.experiments.stress_aggregation --check extensions/results/event_stress_v1/aggregation.csv
      - name: Source quality
        run: |
          uv run ruff check core extensions jalankan_notebook.py
          uv run ruff format --check core extensions jalankan_notebook.py
          uv run ty check core/src extensions/src extensions/experiments jalankan_notebook.py
      - run: uv build --out-dir .tmp/packages

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: industrial_ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.23'
      - name: Install CPU test environment from lock
        run: |
          mkdir -p .tmp .cache
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libgl1
          uv venv --python 3.11
          uv export --frozen --no-hashes --no-emit-project --no-emit-package torch --no-emit-package torchvision -o .tmp/requirements-ci.txt
          python -c "from pathlib import Path; p=Path('.tmp/requirements-ci.txt'); p.write_text('\n'.join(s for s in p.read_text().splitlines() if not s.startswith(('nvidia-', 'cuda-', 'triton==')))+'\n')"
          uv pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r .tmp/requirements-ci.txt
      - name: UI quality and build
        run: |
          npm ci
          npm run typecheck
          npm run check
          npm run build
          npm audit --audit-level=high
      - name: Python dependency audit
        run: |
          .venv/bin/python ../extensions/tests/test_nltk_boundary.py
          # Unpatched, unreachable model-path APIs only; evidence/upgrade trigger: SECURITY.md#nltk-model-path-advisory-exception
          # https://osv.dev/vulnerability/GHSA-8mgp-746c-j5xp (alias PYSEC-2026-3740)
          uvx pip-audit==2.10.1 --path .venv/lib/python3.11/site-packages --skip-editable --ignore-vuln PYSEC-2026-3740
      - name: Audit public versions of CPU/CUDA wheel variants
        run: |
          printf 'torch==2.14.1\ntorchvision==0.29.1\n' > .tmp/requirements-ai-audit.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r .tmp/requirements-ai-audit.txt
      - name: Python quality and media/API regression
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/ty check access.py storage.py app.py vision.py review.py operations.py corrections.py detector_training.py video_finetune.py setup_models.py academic.py event_ledger.py fact_query.py detector_benchmark.py prepare_tracking_reference.py tracking_benchmark.py
          .venv/bin/python tests/storage_check.py
          .venv/bin/python tests/profile_api_check.py
          .venv/bin/python tests/ledger_check.py
          .venv/bin/python tests/ledger_v2_check.py
          .venv/bin/python tests/novelty_v2_check.py
          .venv/bin/python tests/novelty_api_check.py
          .venv/bin/python tests/academic_check.py
          .venv/bin/python tests/fact_check.py
          .venv/bin/python tests/security_check.py
          .venv/bin/python tests/deployment_check.py
          .venv/bin/python tests/self_check.py
          .venv/bin/python tests/review_counts_check.py
          .venv/bin/python tests/tracking_check.py
          .venv/bin/python tests/corrections_check.py
          .venv/bin/python tests/workflow_check.py
          .venv/bin/python tests/video_finetune_check.py
          .venv/bin/python tests/source_group_check.py
          .venv/bin/python tests/detector_benchmark_check.py
          .venv/bin/python tests/tracking_reference_check.py
          .venv/bin/python tests/tracking_benchmark_check.py
          .venv/bin/python tests/audit_read_check.py
      - name: Real learning and inference smoke
        run: |
          .venv/bin/python setup_models.py --vision-only
          .venv/bin/python tests/training_check.py cpu
          .venv/bin/python tests/training_check.py cpu helmets
      - name: Build and inspect distributions
        run: |
          uv build --out-dir .tmp/packages
          .venv/bin/python tests/package_check.py .tmp/packages
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-checks
          path: industrial_ai/.tmp/**/report.json
          retention-days: 7
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment configuration
        working-directory: industrial_ai
        run: |
          docker compose config --quiet
      - name: Build CPU image and test restricted runtime
        run: |
          docker build -f industrial_ai/Dockerfile -t video-insight-ci .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /workspace/industrial_ai/data:uid=10001,gid=10001,mode=0700 \
            --tmpfs /workspace/industrial_ai/models:uid=10001,gid=10001,mode=0700 \
            --tmpfs /workspace/industrial_ai/.cache:uid=10001,gid=10001,mode=0700 \
            --tmpfs /workspace/industrial_ai/.tmp:uid=10001,gid=10001,mode=0700 \
            video-insight-ci python tests/deployment_check.py
      - name: Verify published HTTPS deployment
        working-directory: industrial_ai
        run: |
          mkdir -p .tmp
          docker tag video-insight-ci studio-ci-app
          python - <<'PY'
          import http.cookiejar, json, secrets, ssl, subprocess, time, urllib.error, urllib.request
          from pathlib import Path
          compose = ['docker', 'compose', '-p', 'studio-ci']
          password = secrets.token_urlsafe(32)
          bootstrap = 'import access,json,sys; d=json.load(sys.stdin); access.store().bootstrap(d["username"],d["password"])'
          subprocess.run(compose + ['run', '--no-deps', '--rm', '-T', 'app', 'python', '-c', bootstrap], input=json.dumps({'username': 'ci-owner', 'password': password}), text=True, stdout=subprocess.DEVNULL, check=True)
          subprocess.run(compose + ['up', '-d', '--no-build', '--wait', '--wait-timeout', '120'], check=True)
          ca = Path('.tmp/caddy-root.crt')
          for attempt in range(30):
              result = subprocess.run(compose + ['exec', '-T', 'proxy', 'cat', '/data/caddy/pki/authorities/local/root.crt'], capture_output=True)
              if result.returncode == 0 and b'BEGIN CERTIFICATE' in result.stdout:
                  ca.write_bytes(result.stdout)
                  break
              time.sleep(1)
          else:
              print(result.stderr.decode(errors='replace'), flush=True)
              raise AssertionError('Caddy local CA was not generated')
          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=str(ca))), urllib.request.HTTPCookieProcessor(cookies))
          def request(path, body=None, csrf=None):
              headers = {'Origin': 'https://localhost'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              if csrf is not None:
                  headers['X-CSRF-Token'] = csrf
              req = urllib.request.Request('https://localhost' + path, data=json.dumps(body).encode() if body is not None else None, headers=headers)
              try:
                  response = client.open(req, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.headers, response.read()
          for attempt in range(30):
              try:
                  status, _, _ = request('/healthz')
                  if status == 200:
                      break
              except (OSError, urllib.error.URLError):
                  pass
              time.sleep(1)
          else:
              raise AssertionError('Published HTTPS health check failed')
          assert request('/')[0] == 200
          assert request('/api/jobs')[0] == 401
          status, headers, body = request('/api/auth/login', {'username': 'ci-owner', 'password': password})
          assert status == 200, status
          session = json.loads(body)
          assert session['user']['role'] == 'admin' and session['csrf_token']
          cookie = next(cookie for cookie in cookies if cookie.name == 'insight_session')
          assert cookie.secure and cookie.has_nonstandard_attr('HttpOnly')
          assert request('/api/jobs')[0] == 200
          assert request('/api/auth/logout', {})[0] == 403
          assert request('/api/auth/logout', {}, session['csrf_token'])[0] == 200
          assert request('/api/jobs')[0] == 401
          print('PASS: published HTTPS, verified Caddy CA, login, Secure/HttpOnly cookie, CSRF and logout')
          PY
      - name: Diagnose deployment smoke failure
        if: failure()
        working-directory: industrial_ai
        run: |
          docker compose -p studio-ci ps --all
          docker compose -p studio-ci logs --no-color --tail 150
      - name: Clean deployment smoke resources
        if: always()
        working-directory: industrial_ai
        run: docker compose -p studio-ci down --volumes --remove-orphans
