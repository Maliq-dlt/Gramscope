[project]
name = "industrial-video-workspace"
version = "0.1.0"
description = "Local video tracking and grounded chat"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ngram-assignment==0.1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "ultralytics>=8.4",
  "transformers>=5.10,<6",
  "peft>=0.14",
  "lap>=0.5.12",
  "torch==2.14.1+cu130",
  "torchvision==0.29.1+cu130",
  "setuptools>=83",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
ngram-assignment = { path = "..", editable = true }
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "vision", "chat", "runtime", "setup_models", "fine_tune_chat", "detector_training", "prompt_tracking", "corrections", "video_finetune", "operations", "review", "access", "storage", "academic", "event_ledger", "fact_query"]

[tool.setuptools.data-files]
"share/industrial-video-workspace" = ["index.html", "dashboard.js", "auth.js", "theme.js", "motion.js", "app.js", "Dockerfile", "compose.yaml", "Caddyfile.example", ".dockerignore"]
"share/industrial-video-workspace/frontend" = ["frontend/App.tsx", "frontend/main.tsx", "frontend/studio.ts", "frontend/Account.tsx", "frontend/Annotation.tsx", "frontend/ChatPanel.tsx", "frontend/VideoPanel.tsx", "frontend/Workspace.tsx", "frontend/LiveViews.tsx", "frontend/NgramLab.tsx", "frontend/EventLedger.tsx", "frontend/auth.ts", "frontend/motion.ts", "frontend/tsconfig.auth.json", "frontend/tsconfig.studio.json", "frontend/tsconfig.json", "frontend/tsconfig.motion.json"]
"share/industrial-video-workspace/docs" = ["docs/HARDENING.md", "docs/VERIFICATION_SECURITY.md", "docs/README.md", "docs/EVENT_CONTRACT.md", "docs/DATA_POLICY.md", "docs/TRACKING_ACCURACY.md"]
"share/industrial-video-workspace/assets" = ["assets/dashboard.css", "assets/brand.svg", "assets/crowd.png", "assets/THIRD_PARTY_LICENSES.txt"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ruff>=0.12",
    "ty>=0.0.1",
    "build>=1.2",
    "trackeval==1.3.0",
    "scipy==1.17.1",
    "sahi==0.12.8",
]

[tool.ty.environment]
# The N-gram dependency is installed editable from the repository parent.
extra-paths = [".."]
